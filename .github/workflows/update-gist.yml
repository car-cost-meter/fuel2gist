name: Update fuel stations gist

# Triggered externally (cron-job.org -> workflow_dispatch). GitHub's own
# `schedule:` event is intentionally not used: it is best-effort (delayed or
# dropped runs) and auto-disabled after 60 days of repository inactivity.
# See "Triggering the workflow" in README.md.
on:
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Fetch, condense and push to gist
        run: python fuel2gist.py
        env:
          GIST_URL: ${{ vars.GIST }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
